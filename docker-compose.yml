# Local development infrastructure.
#
#   docker compose up -d mongo redis mailpit
#
# Not used in staging/production: those use MongoDB Atlas, managed Redis and Resend, with
# the web app and the API on Vercel (decision 0025).
name: makemymarriage

services:
  mongo:
    image: mongo:8.0
    # Single-node replica set so multi-document transactions work locally,
    # matching Atlas (Database Design §24).
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports its health.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    # Rate-limit counters must never be evicted early.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Local email inbox: the API sends via SMTP on 1025; read mail at http://localhost:8025.
    # Nothing is delivered to real addresses (decision 0015).
    image: axllent/mailpit:v1
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  mongo-data:
  redis-data:
