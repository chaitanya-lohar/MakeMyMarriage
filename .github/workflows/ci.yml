# Continuous integration (System Design §23): lint → unit tests → integration tests →
# build → deployment validation. Deployment workflows are added with the hosting setup.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The web build refuses to run without an API origin to proxy /api/v1 to.
      API_INTERNAL_URL: http://localhost:3001
      REDIS_URL: redis://localhost:6379/15
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Cache MongoDB binaries for integration tests
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Integration tests
        run: pnpm test:integration

      - run: pnpm build

      - name: Check the OpenAPI contract and client types are up to date
        run: |
          pnpm api:contract
          git diff --exit-code -- packages/api-client

  docker:
    name: Build API/worker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
